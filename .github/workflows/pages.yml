name: Deploy to GitHub Pages

# Déploie le site statique sur GitHub Pages à chaque push sur `main`.
# Le cœur Rust est compilé en WebAssembly dans la CI (pkg/ n'est pas commité).
# Requiert : Settings → Pages → Source = « GitHub Actions ».

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tokenizer.json"
      - "xtask/**"
      - "index.html"
      - "css/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"

      - name: Build WebAssembly core
        run: wasm-pack build --target web --out-dir pkg

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html LICENSE THIRD_PARTY_LICENSE _site/
          cp -r css js assets pkg _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
